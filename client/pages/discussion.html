<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Discussion Room | Multi-Agent GD</title>

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages/discussion.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<header>

    <nav class="navbar">

        <div class="logo">

            <h2>Multi-Agent GD</h2>

        </div>

    </nav>

</header>

<!-- ================= HEADER ================= -->

<section id="discussion-header">

    <div>

        <h2 id="discussion-topic">

            Loading Topic...

        </h2>

        <p>

            <span id="discussion-mode"></span>

            •

            <span id="discussion-language"></span>

        </p>

    </div>

    <div class="header-right">

        <div class="timer">

            <i class="fa-solid fa-clock"></i>

            <span id="discussion-timer">

                00:00

            </span>

        </div>

        <button id="leave-btn">

            Leave

        </button>

    </div>

</section>

<!-- ================= MAIN ================= -->

<section id="discussion-room">

    <!-- PARTICIPANTS -->

    <div id="meeting-grid">

        <!-- JS creates AI + USER cards -->

    </div>

    <!-- TRANSCRIPT -->

    <div id="transcript-panel">

        <div id="transcript-title">

            Live Transcript

        </div>

        <div id="transcript-body">

        </div>

    </div>

</section>

<!-- ================= CONTROLS ================= -->

<section id="controls">

    <button id="mic-btn">

        <i class="fa-solid fa-microphone"></i>

    </button>

    <button id="pause-btn">

        <i class="fa-solid fa-pause"></i>

    </button>

    <button id="resume-btn">

        <i class="fa-solid fa-play"></i>

    </button>

    <button id="toggle-transcript-btn">

        <i class="fa-solid fa-file-lines"></i>

    </button>

    <button id="end-btn">

        <i class="fa-solid fa-phone-slash"></i>

    </button>

</section>

<script src="../js/main.js"></script>
<script src="../js/pages/discussion.js"></script>

</body>

</html>
